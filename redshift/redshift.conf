; Eye comfort (Night Shift). Ranges interpolate; single HH:MM is instant.
; Appearance GTK flip stays at midpoints 07:00 / 18:00 (schedule.conf).
; man redshift
; manual lat/lon are ignored (dawn/dusk drive color). They exist so redshift
; does not query GeoClue and exit at login when no fix is available.

[redshift]
temp-day=5000
temp-night=3000
brightness-day=1.0
brightness-night=0.85
fade=1
adjustment-method=randr
location-provider=manual
dawn-time=6:00-8:00
dusk-time=17:00-19:00

[manual]
lat=0.0
lon=0.0
