# Reload: prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Fish in new panes/windows (Apple Silicon Homebrew, Intel Homebrew, Linux)
if-shell 'test -x /opt/homebrew/bin/fish' {
    set-option -g default-shell /opt/homebrew/bin/fish
} {
    if-shell 'test -x /usr/local/bin/fish' {
        set-option -g default-shell /usr/local/bin/fish
    } {
        if-shell 'test -x /usr/bin/fish' {
            set-option -g default-shell /usr/bin/fish
        }
    }
}

# Kitty: truecolor + undercurl (tmux 3.0+)
set -g default-terminal "xterm-kitty"
set -ga terminal-overrides ",xterm-kitty:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Vim-style panes
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -sg escape-time 10
set-option -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g status-position top

# Plugins live in ~/.tmux/plugins (not this git repo). Set path before TPM runs.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'

# Catppuccin lives at ~/.tmux/plugins/catppuccin (not TPM name `tmux` — that path was dracula).
if-shell 'test -f $HOME/.local/state/appearance/tmux.conf' \
  'source-file $HOME/.local/state/appearance/tmux.conf'
if-shell 'test -f $HOME/.tmux/plugins/catppuccin/catppuccin.tmux' \
  'run $HOME/.tmux/plugins/catppuccin/catppuccin.tmux'

set -g @catppuccin_window_status_style "rounded"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Re-apply pane bg after catppuccin (it may reset styles).
if-shell 'test -f $HOME/.local/state/appearance/tmux.conf' \
  'source-file $HOME/.local/state/appearance/tmux.conf'

