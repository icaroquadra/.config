# Reload: prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Fish in new panes/windows (Apple Silicon Homebrew, Intel Homebrew, Linux)
if-shell 'test -x /opt/homebrew/bin/fish' {
    set-option -g default-shell /opt/homebrew/bin/fish
} {
    if-shell 'test -x /usr/local/bin/fish' {
        set-option -g default-shell /usr/local/bin/fish
    } {
        if-shell 'test -x /usr/bin/fish' {
            set-option -g default-shell /usr/bin/fish
        }
    }
}

# Kitty: truecolor + undercurl (tmux 3.0+)
set -g default-terminal "xterm-kitty"
set -ga terminal-overrides ",xterm-kitty:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Vim-style panes
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -sg escape-time 10
set-option -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g status-position top

# Plugins (prefix + I to install)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'

set -g @dracula-show-powerline true
set -g @dracula-fixed-location "CWB"
set -g @dracula-show-fahrenheit false
set -g @dracula-cpu-usage-label "CPU"
set -g @dracula-plugins "weather ram-usage cpu-usage"
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session

# Keep plugins in ~/.tmux/plugins even though the conf lives under XDG.
# Otherwise TPM would install into ~/.config/tmux/plugins (this git repo).
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# Initialize TMUX plugin manager (keep this line at the very bottom).
# -b: do not fail `source-file` if TPM exits 1 after plugins already loaded.
run -b "$HOME/.tmux/plugins/tpm/tpm"
